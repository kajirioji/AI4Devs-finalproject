    get:
      summary: Attempts of the account in any status, newest first, paginated
      tags: *a9
      description: "Ordered by processedAt, batchNo and attemptNo, descending. status
        filters by attempt status. from and to are inclusive YYYY-MM-DD days of
        dateField: settlementDate (default) compares the business date as
        stored, and leaves out attempts without one; processedAt compares the
        New York calendar day of the processing instant, daylight saving
        included. from after to is a validation_error. page from 1, pageSize
        1-500 (50). No permission of its own; 404 also outside the scope."
      parameters:
        - schema:
            type: string
            enum:
              - processed
              - paid
              - undone
          in: query
          name: status
          required: false
        - schema:
            default: settlementDate
            type: string
            enum:
              - settlementDate
              - processedAt
          in: query
          name: dateField
          required: false
        - schema:
