                  message:
                    type: string
                  details: {}
                required:
                  - code
                  - message
                additionalProperties: false
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token (idempotent)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
