                  - accessToken
                  - refreshToken
                  - expiresIn
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details: {}
                required:
                  - code
                  - message
                additionalProperties: false
        "401":
